<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create a TravelBuddy account to book trips and manage your travel plans.">
  <title>Sign In — TravelBuddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-page">
    <!-- LEFT IMAGE -->
    <div class="auth-image">
      <div class="auth-image-content">
        <h2>Start Your Journey</h2>
        <p>Join 50,000+ travelers exploring the world with TravelBuddy.</p>
      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="auth-form-section">
      <div class="auth-form-box">
        <a href="index.html" class="nav-logo"><img src="logo.png" alt="TravelBuddy"> TravelBuddy</a>
        <p>Welcome back! Sign in to continue your adventure.</p>

        <div class="auth-tabs">
          <button class="active" id="loginTab" onclick="switchTab('login')">Sign In</button>
          <button id="signupTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <div class="auth-extras">
            <label><input type="checkbox"> Remember me</label>
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Sign In</button>
        </form>

        <!-- SIGNUP FORM -->
        <form class="auth-form" id="signupForm" style="display:none;">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Min. 8 characters" required>
          </div>
          <div class="form-group">
            <label for="signupConfirm">Confirm Password</label>
            <input type="password" id="signupConfirm" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Create Account</button>
        </form>


      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
